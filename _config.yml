# Thryvals: write-ups from building Thryve.
# GitHub Pages builds this site with Jekyll on every push to main.
title: Thryvals
description: Write-ups from building Thryve
theme: minima
plugins:
  - jekyll-feed
  - jekyll-seo-tag
exclude:
  - README.md
# GitHub builds the site on UTC time, where it can still be the day before a post's date.
# Publish such posts anyway, so a post appears as soon as it's pushed.
future: true
