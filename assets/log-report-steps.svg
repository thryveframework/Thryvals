<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 276" width="760" height="276" role="img" aria-label="Every step starts as soon as its input is ready" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="report-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#8c959f"/>
    </marker>
  </defs>
  <rect width="760" height="276" fill="#ffffff"/>
  <text x="24" y="34" font-size="15" font-weight="600" fill="#1f2328">Every step starts as soon as its input is ready</text>
  <text x="24" y="54" font-size="11.5" fill="#59636e">The log report, as declare_report sets it up</text>

  <!-- Arrows; the dashed one is a notification -->
  <g fill="none" stroke="#8c959f" stroke-width="1.25">
    <path d="M116 174H144" marker-end="url(#report-arrow)"/>
    <path d="M240 174H268" marker-end="url(#report-arrow)"/>
    <path d="M344 174L388 111" marker-end="url(#report-arrow)"/>
    <path d="M344 174L388 153" marker-end="url(#report-arrow)"/>
    <path d="M344 174L388 195" marker-end="url(#report-arrow)"/>
    <path d="M344 174L388 237" marker-end="url(#report-arrow)"/>
    <path d="M504 111L548 162" marker-end="url(#report-arrow)"/>
    <path d="M504 153L548 170" marker-end="url(#report-arrow)"/>
    <path d="M504 195L548 178" marker-end="url(#report-arrow)"/>
    <path d="M504 237L548 186" marker-end="url(#report-arrow)"/>
    <path d="M624 174H652" stroke-dasharray="4 3" marker-end="url(#report-arrow)"/>
  </g>
  <text x="638" y="140" text-anchor="middle" font-size="11.5" fill="#59636e">notification</text>

  <!-- LogReader -->
  <rect x="24" y="150" width="92" height="48" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25"/>
  <text x="70" y="169" text-anchor="middle" font-weight="600" fill="#1f2328">LogReader</text>
  <text x="70" y="187" text-anchor="middle" font-size="11.5" fill="#59636e">plugin</text>

  <!-- Parse x8: two outlines behind the box stand for the other tasks -->
  <path d="M152 142H240V190" fill="none" stroke="#8c959f" stroke-width="1.25"/>
  <path d="M148 146H236V194" fill="none" stroke="#8c959f" stroke-width="1.25"/>
  <rect x="144" y="150" width="88" height="48" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.25"/>
  <text x="188" y="169" text-anchor="middle" font-weight="600" fill="#1f2328">Parse ×8</text>
  <text x="188" y="187" text-anchor="middle" font-size="11.5" fill="#59636e">split_into</text>

  <!-- Merge -->
  <rect x="268" y="150" width="76" height="48" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25"/>
  <text x="306" y="169" text-anchor="middle" font-weight="600" fill="#1f2328">Merge</text>
  <text x="306" y="187" text-anchor="middle" font-size="11.5" fill="#59636e">join</text>

  <!-- The four sections, sharing Merge's result -->
  <text x="446" y="86" text-anchor="middle" font-size="11.5" fill="#59636e">fan_out</text>
  <rect x="388" y="96" width="116" height="30" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25"/>
  <text x="446" y="115" text-anchor="middle" fill="#1f2328">Totals</text>
  <rect x="388" y="138" width="116" height="30" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25"/>
  <text x="446" y="157" text-anchor="middle" fill="#1f2328">StatusCodes</text>
  <rect x="388" y="180" width="116" height="30" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25"/>
  <text x="446" y="199" text-anchor="middle" fill="#1f2328">TopPages</text>
  <rect x="388" y="222" width="116" height="30" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25"/>
  <text x="446" y="241" text-anchor="middle" fill="#1f2328">Alerts</text>

  <!-- Report -->
  <rect x="548" y="150" width="76" height="48" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25"/>
  <text x="586" y="169" text-anchor="middle" font-weight="600" fill="#1f2328">Report</text>
  <text x="586" y="187" text-anchor="middle" font-size="11.5" fill="#59636e">join</text>

  <!-- Console -->
  <rect x="652" y="150" width="84" height="48" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25"/>
  <text x="694" y="169" text-anchor="middle" font-weight="600" fill="#1f2328">Console</text>
  <text x="694" y="187" text-anchor="middle" font-size="11.5" fill="#59636e">observer</text>
</svg>
